<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nightbaby | Staff Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-page"><div class="dashboard-container">
        <aside class="dashboard-sidebar">
                <div class="sidebar-logo">
                    <img src="images/logo.png" alt="nightbaby" class="sidebar-logo-img"/>
                </div>

                <div class="sidebar-user">
                    <button class="user-role-btn" id="userRoleBtn">
                        <img class="sideNavIcon" src="sources/icons/user-svgrepo-com(1).png" alt="home-icon" width="20" height="20">
                        <span id="userRoleText">Admin</span>
                    </button>
                </div>

                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="sidebar-link" data-page="dashboard">
                        <img class="sideNavIcon" src="sources/icons/home-svgrepo-com.png" alt="home-icon" width="25" height="25">
                        <span>Dashboard</span>
                    </a>

                    <div class="sub-nav-group">
                        <a href="transaction.html" class="sidebar-link active" data-page="transaction">
                            <img class="sideNavIcon" src="sources/icons/archive-svgrepo-com.png" alt="home-icon" width="25" height="25">
                            <span>Transactions</span>
                        </a>

                        <div class="sub-nav-items">
                            <a href="inventory.html" class="sub-sidebar-link" data-subpage="inventory">
                                <span class="sub-bullet">▸</span>
                                <span>Inventory</span>
                            </a>
                            <a href="discount.html" class="sub-sidebar-link" data-subpage="discounts">
                                <span class="sub-bullet">▸</span>
                                <span>Discounts</span>
                            </a>
                            <a href="staff_management.html" class="sub-sidebar-link" data-subpage="staffs">
                                <span class="sub-bullet">▸</span>
                                <span>Staff Management</span>
                            </a>
                        </div>
                    </div>
                </nav>

                <div class="sidebar-footer">
                    <a href="index.html" class="sidebar-link logout">
                        <img class="sideNavIcon" src="sources/icons/logout-svgrepo-com.png" alt="home-icon" width="25" height="25">
                        <span>Logout</span>
                    </a>
                </div>
            </aside>
            <main class="dashboard-main">
                <div class="dashboard-topbar">
                    <div class="topbar-left">
                        <div class="page-header">
                            <img class="page-icon" src="sources/icons/user-svgrepo-com(1).png" alt="transactions" width="35" height="35">
                            <h1 class="page-title" id="pageTtle">Staff Management</h1>
                        </div>
                    </div>

                    <div class="topbar-right">
                        <div class="topbar-datetime">
                            <span class="datetime-day" id="currentDay">Saturday</span>
                            <span class="datetime-date" id="currentDate">August 1, 2026</span>
                            <span class="datetime-time" id="currentTime">3:45 PM</span>
                        </div>
                        <span class="admin-name" id="topbarAdminName">Admin</span>
                        <div class="admin-avatar">
                            <img src="sources/icons/user-svgrepo-com.png" alt="user-mainlogo" width="20" height="20">
                        </div>
                    </div>
                </div>
                <div class="user-management-section dashboard-card"><div class="section-header panel-header"><h2>Staff Accounts</h2><button type="button" class="primary-btn" id="addUserButton">+ Add Staff</button></div><div class="alert-table-wrapper"><table class="alert-table user-table"><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody id="usersTableBody"></tbody></table></div></div>
                <div class="account-modal-overlay" id="userModal" hidden><section class="account-modal" role="dialog" aria-modal="true" aria-labelledby="userModalTitle"><div class="account-modal-header"><h2 id="userModalTitle">Add Staff</h2><button type="button" class="pos-modal-close" id="closeUserModal">&times;</button></div><form id="userForm" class="account-form"><input type="hidden" id="editingUsername"><div class="form-group"><label for="userUsername">Username</label><input id="userUsername" required autocomplete="username"></div><div class="form-group"><label for="accountHolderName">Account Holder Name</label><input id="accountHolderName" type="text" required autocomplete="name" placeholder="Enter full name"></div><div class="form-group"><label for="userRole">Role</label><select id="userRole" required><option value="cashier">Cashier</option><option value="admin">Admin</option><option value="it">Super User</option></select></div><div class="form-group"><label for="userPassword">Password</label><input id="userPassword" type="password" autocomplete="new-password"></div><p class="account-form-error" id="userFormError" role="alert"></p><div class="account-modal-footer"><button type="button" class="modal-btn-cancel" id="cancelUserModal">Cancel</button><button type="submit" class="modal-btn-confirm">Save Staff</button></div></form></section></div>
                <footer class="dashboard-footer"><p>nightbaby™ @2026 | LLC Registered</p></footer>
            </main>
        </div>
    </div>
    <script src="js/global.js"></script><script src="js/account_management.js?v=3"></script>
</body>
</html>
